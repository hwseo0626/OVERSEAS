<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해외물류 패킹 라벨 가이드</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-border {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { border-color: #f87171; box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }
    .label-target-box { animation: pulse-border 1.8s infinite; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <i data-lucide="package-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold tracking-tight">해외물류 라벨 스티커 부착 가이드</h1>
          <p class="text-xs text-slate-400">고객사별 라벨 규격 및 부착 위치 실시간 안내</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-300">
          가이드 <span id="guideCount" class="text-white">0</span>건
        </span>
        <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="file-up" class="w-4 h-4"></i>
          <span>엑셀 업로드</span>
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden">
        </label>
        <button onclick="resetToDefaultData()" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800" title="기본값 초기화">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8 space-y-6">
      
      <!-- Search Panel -->
      <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
          <div class="md:col-span-4">
            <label class="block text-xs font-semibold text-slate-500 mb-1">고객사 직접 선택</label>
            <div class="relative">
              <select id="buyerSelect" onchange="onBuyerSelectChange()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none appearance-none">
                <option value="">고객사 전체 (바코드 매핑)</option>
              </select>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-3 pointer-events-none"></i>
            </div>
          </div>

          <div class="md:col-span-8">
            <label class="block text-xs font-semibold text-slate-500 mb-1">제품 바코드 또는 SKU 스캔 (Enter)</label>
            <div class="flex gap-2">
              <div class="relative flex-1">
                <i data-lucide="scan-barcode" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3"></i>
                <input type="text" id="barcodeInput" autofocus placeholder="바코드를 스캔하세요 (예: 8801234567890)" 
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-11 pr-4 py-2.5 text-base font-bold text-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              </div>
              <button onclick="handleSearch()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition">
                조회
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Guide Display -->
      <section id="guideDisplayCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div id="emptyState" class="py-16 text-center space-y-2">
          <i data-lucide="barcode" class="w-10 h-10 text-slate-300 mx-auto"></i>
          <h3 class="text-sm font-bold text-slate-600">바코드를 스캔하거나 상단 고객사를 선택하세요</h3>
        </div>

        <div id="guideContent" class="hidden space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-100">
            <div>
              <div class="flex items-center gap-2">
                <span id="resBuyerBadge" class="px-2.5 py-1 rounded-md text-xs font-black bg-blue-100 text-blue-800">고객사</span>
                <span id="resPrintBadge" class="px-2.5 py-1 rounded-md text-xs font-bold bg-purple-100 text-purple-900 border border-purple-300">규격</span>
              </div>
              <h2 id="resItemName" class="text-lg md:text-xl font-black text-slate-900 mt-1">제품명</h2>
              <p id="resBarcodeSub" class="text-xs text-slate-400 font-mono">Barcode: -</p>
            </div>
            <div id="resSideBadge" class="px-4 py-2 rounded-xl text-sm font-extrabold flex items-center gap-2 shadow-sm bg-indigo-600 text-white">
              <i data-lucide="layers" class="w-4 h-4"></i>
              <span id="resSideText">패키지 뒤 부착</span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
            <!-- Box Diagram -->
            <div class="md:col-span-5 flex flex-col items-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
              <span class="text-xs font-semibold text-slate-400 mb-2" id="diagramHeader">도식도</span>
              <div id="packageBox" class="w-44 h-60 bg-white rounded-xl border-2 border-slate-300 shadow-inner relative flex flex-col justify-between p-3">
                <div class="w-8 h-8 rounded border border-dashed border-slate-300 bg-slate-100 flex items-center justify-center text-[9px] text-slate-400">Top</div>
                <div id="defaultBarcodeArea" class="w-20 h-7 bg-slate-100 border border-slate-300 rounded self-center flex items-center justify-center text-[9px] text-slate-400">기존바코드</div>
                <div id="targetStickerBox" class="absolute w-24 h-9 bg-red-100 border-2 border-red-500 rounded-lg label-target-box flex items-center justify-center text-center p-1 shadow-md">
                  <span id="targetStickerName" class="text-[9px] font-black text-red-700">라벨</span>
                </div>
              </div>
              <span id="diagramSubtext" class="text-[11px] font-bold text-slate-600 mt-2">가이드</span>
            </div>

            <!-- Details -->
            <div class="md:col-span-7 space-y-3">
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                  <span class="text-slate-400 block mb-0.5">라벨 출력 규격</span>
                  <span id="resPrintMethod" class="font-bold text-slate-800">조립처 요청</span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                  <span class="text-slate-400 block mb-0.5">바코드 처리 방식</span>
                  <span id="resBarcodeHandling" class="font-bold text-slate-800">가리지 않음</span>
                </div>
              </div>

              <!-- Photo Area -->
              <div id="imageDisplayArea" class="rounded-xl border p-2.5 flex items-center gap-2.5"></div>

              <!-- Warning Box -->
              <div id="warningBox" class="p-3 rounded-xl border bg-amber-50 border-amber-200 text-amber-900 flex gap-2 items-start">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                <div>
                  <h4 class="text-xs font-black text-amber-800">특이사항</h4>
                  <p id="resWarningText" class="text-xs font-semibold mt-0.5 whitespace-pre-line leading-relaxed">내용</p>
                </div>
              </div>

              <button onclick="markComplete()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-md transition">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                <span>패킹 확인 완료 (Space / Enter)</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- History Panel -->
    <div class="lg:col-span-4 space-y-4">
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-around text-center">
        <div>
          <span class="text-xs font-semibold text-slate-400 block">오늘 완료 수량</span>
          <span id="completedCount" class="text-2xl font-black text-slate-900">0</span>
        </div>
        <div class="w-px bg-slate-200"></div>
        <div>
          <span class="text-xs font-semibold text-slate-400 block">직전 작업 고객사</span>
          <span id="lastBuyerName" class="text-sm font-black text-blue-600 leading-7">-</span>
        </div>
      </section>

      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-1.5">
          <i data-lucide="history" class="w-3.5 h-3.5 text-slate-400"></i> 최근 작업 내역
        </h3>
        <div id="historyList" class="space-y-2 max-h-80 overflow-y-auto text-xs">
          <p class="text-slate-400 text-center py-4">내역 없음</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Script -->
  <script>
    const DEFAULT_GUIDES = [
      { buyer: "D-R-O", pos: "패키지 뒤", side: "뒤", handling: "바코드 가리지않음", printMethod: "조립처에 요청", stickerSize: "공통 스티커", hasRealPhoto: true, photoFile: "dro_sample.png", notes: "공통 스티커 부착\n※ 유니버셜 품목은 별도의 품목 스티커 출력 후 부착 필요" },
      { buyer: "ELEMENT", pos: "패키지 뒤", side: "뒤", handling: "바코드 가리지않음", printMethod: "아이라벨 65 X 44\n(품목별 이미지파일 출력)", stickerSize: "65 X 44", hasRealPhoto: true, photoFile: "element_sample.png", notes: "품목 별 스티커 출력 후 부착\n※ 신규 품목 입고 시 고객사에 이미지 파일 요청 필수" },
      { buyer: "ROA", pos: "패키지 뒤", side: "뒤", handling: "바코드 가림 (덮어 부착)", printMethod: "아이라벨 45 X 35\n(품목별 데이터파일 출력)", stickerSize: "45 X 35", hasRealPhoto: true, photoFile: "roa_sample.png", notes: "품목 별 스티커 출력 후 부착 (기존 바코드 완벽 가림)\n※ 신규 품목 입고 시 바코드 데이터 요청 필수" },
      { buyer: "JARIR", pos: "패키지 뒤", side: "뒤", handling: "바코드 가리지않음", printMethod: "조립처에 요청", stickerSize: "공통 스티커", hasRealPhoto: false, photoFile: "", notes: "공통 스티커 부착\n※ 실리콘밴드, 캐링케이스 등 특정 품목은 별도의 스티커 추가 부착 必" },
      { buyer: "TAICHEONG", pos: "패키지 앞", side: "앞", handling: "해당 없음 (-)", printMethod: "조립처에 요청", stickerSize: "공통 스티커", hasRealPhoto: true, photoFile: "taicheong_sample.png", notes: "공통스티커 부착 (패키지 전면 지정 위치)" }
    ];

    const DEFAULT_ITEMS = [
      { barcode: "8801234567890", sku: "CAS-IP16-CLR", name: "아이폰 16 투명 케이스", buyer: "D-R-O" },
      { barcode: "8801234567891", sku: "CAS-ZF7-SLM", name: "갤럭시 Z폴드7 슬림 핏 케이스", buyer: "ROA" },
      { barcode: "8801234567892", sku: "ELM-GLS-9H", name: "강화유리 액정보호필름 2P", buyer: "ELEMENT" },
      { barcode: "8801234567893", sku: "JAR-BND-SIL", name: "실리콘 밴드 스트랩", buyer: "JARIR" },
      { barcode: "8801234567894", sku: "TCH-CHR-30W", name: "고속 듀얼 충전기 30W", buyer: "TAICHEONG" }
    ];

    let guideRules = [...DEFAULT_GUIDES];
    let itemMaster = [...DEFAULT_ITEMS];
    let completedCount = 0;
    let history = [];
    let currentActiveGuide = null;

    window.addEventListener('DOMContentLoaded', () => {
      populateBuyerDropdown();
      document.getElementById('guideCount').innerText = guideRules.length;
      lucide.createIcons();

      document.getElementById('barcodeInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSearch();
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
          e.preventDefault();
          markComplete();
        }
      });
    });

    function populateBuyerDropdown() {
      const select = document.getElementById('buyerSelect');
      select.innerHTML = '<option value="">고객사 전체 (바코드 매핑)</option>';
      guideRules.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.buyer;
        opt.innerText = g.buyer;
        select.appendChild(opt);
      });
    }

    function onBuyerSelectChange() {
      const buyer = document.getElementById('buyerSelect').value;
      if (!buyer) return;
      const rule = guideRules.find(g => g.buyer === buyer);
      if (rule) displayGuide({ buyer: rule.buyer, name: `${rule.buyer} 기본 출고`, barcode: '-', sku: '-', rule: rule });
    }

    function handleSearch() {
      const query = document.getElementById('barcodeInput').value.trim();
      const buyer = document.getElementById('buyerSelect').value;
      let item = itemMaster.find(i => i.barcode === query || i.sku.toLowerCase() === query.toLowerCase());
      let targetBuyer = buyer || (item ? item.buyer : null);

      if (!targetBuyer && !item) {
        alert('일치하는 바코드가 없습니다.');
        return;
      }

      let rule = guideRules.find(r => r.buyer === targetBuyer) || guideRules[0];
      displayGuide({
        buyer: targetBuyer,
        name: item ? item.name : `${targetBuyer} 품목`,
        barcode: item ? item.barcode : query,
        sku: item ? item.sku : '-',
        rule: rule
      });
    }

    function displayGuide(data) {
      currentActiveGuide = data;
      const r = data.rule;

      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('guideContent').classList.remove('hidden');

      document.getElementById('resBuyerBadge').innerText = data.buyer;
      document.getElementById('resItemName').innerText = data.name;
      document.getElementById('resBarcodeSub').innerText = `Barcode: ${data.barcode} | SKU: ${data.sku}`;

      document.getElementById('resPrintBadge').innerText = r.stickerSize;

      const sideBadge = document.getElementById('resSideBadge');
      const sideText = document.getElementById('resSideText');
      if (r.side === '앞') {
        sideBadge.className = 'px-4 py-2 rounded-xl text-sm font-extrabold flex items-center gap-2 shadow-sm bg-rose-600 text-white';
        sideText.innerText = '패키지 앞면 부착';
      } else {
        sideBadge.className = 'px-4 py-2 rounded-xl text-sm font-extrabold flex items-center gap-2 shadow-sm bg-indigo-600 text-white';
        sideText.innerText = '패키지 뒷면 부착';
      }

      document.getElementById('resPrintMethod').innerText = r.printMethod;
      document.getElementById('resBarcodeHandling').innerText = r.handling;
      document.getElementById('resWarningText').innerText = r.notes;

      const imgArea = document.getElementById('imageDisplayArea');
      if (r.hasRealPhoto) {
        imgArea.className = 'rounded-xl border p-2.5 flex items-center gap-2.5 bg-emerald-50 border-emerald-200';
        imgArea.innerHTML = `<i data-lucide="image" class="w-4 h-4 text-emerald-600"></i><span class="text-xs font-bold text-emerald-800">실부착 사진 등록됨 (${r.photoFile})</span>`;
      } else {
        imgArea.className = 'rounded-xl border p-2.5 flex items-center gap-2.5 bg-amber-50 border-amber-200';
        imgArea.innerHTML = `<i data-lucide="camera" class="w-4 h-4 text-amber-600"></i><span class="text-xs font-bold text-amber-800">실물 스티커 사진 촬영 대기 중 (추후 연동)</span>`;
      }

      const warnBox = document.getElementById('warningBox');
      warnBox.className = r.handling.includes('가림') 
        ? 'p-3 rounded-xl border bg-rose-50 border-rose-200 text-rose-900 flex gap-2 items-start'
        : 'p-3 rounded-xl border bg-amber-50 border-amber-200 text-amber-900 flex gap-2 items-start';

      const sticker = document.getElementById('targetStickerBox');
      const defaultBc = document.getElementById('defaultBarcodeArea');
      document.getElementById('targetStickerName').innerText = r.stickerSize;
      document.getElementById('diagramHeader').innerText = `패키지 [${r.side}면] 도식도`;

      if (r.side === '앞') {
        defaultBc.style.display = 'none';
        sticker.style.top = '45%';
        sticker.style.left = '20%';
        document.getElementById('diagramSubtext').innerHTML = "<span class='text-rose-600 font-bold'>★ 전면 부착</span>";
      } else {
        defaultBc.style.display = 'flex';
        if (r.handling.includes('가림')) {
          sticker.style.top = '65%';
          sticker.style.left = '16%';
          document.getElementById('diagramSubtext').innerHTML = "<span class='text-rose-600 font-extrabold'>[경고] 바코드 덮어 가림</span>";
        } else {
          sticker.style.top = '25%';
          sticker.style.left = '16%';
          document.getElementById('diagramSubtext').innerHTML = "<span class='text-emerald-700 font-bold'>[확인] 바코드 여백 부착</span>";
        }
      }
      lucide.createIcons();
    }

    function markComplete() {
      if (!currentActiveGuide) return;
      completedCount++;
      document.getElementById('completedCount').innerText = completedCount;
      document.getElementById('lastBuyerName').innerText = currentActiveGuide.buyer;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      history.unshift({ time: timeStr, buyer: currentActiveGuide.buyer, name: currentActiveGuide.name });
      renderHistory();

      document.getElementById('barcodeInput').value = '';
      document.getElementById('barcodeInput').focus();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (history.length === 0) return;
      container.innerHTML = history.slice(0, 8).map(h => `
        <div class="p-2 rounded bg-slate-50 border border-slate-200 flex justify-between items-center">
          <span class="font-bold text-slate-700">${h.buyer}</span>
          <span class="text-slate-400 font-mono text-[10px]">${h.time}</span>
        </div>
      `).join('');
    }

    function resetToDefaultData() {
      guideRules = [...DEFAULT_GUIDES];
      itemMaster = [...DEFAULT_ITEMS];
      populateBuyerDropdown();
      document.getElementById('guideCount').innerText = guideRules.length;
      alert('기본 데이터로 초기화되었습니다.');
    }

    document.getElementById('excelFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          if (rows && rows.length > 0) {
            guideRules = rows.map(r => ({
              buyer: r['고객사 명'] || r['고객사명'] || '기타',
              pos: r['부착위치'] || '패키지 뒤',
              side: (r['부착위치'] || '').includes('앞') ? '앞' : '뒤',
              handling: r['부착방식'] || '바코드 가리지않음',
              printMethod: r['스티커 출력 방식'] || '조립처에 요청',
              stickerSize: (r['스티커 출력 방식'] || '').includes('65') ? '65 X 44' : (r['스티커 출력 방식'] || '').includes('45') ? '45 X 35' : '공통 스티커',
              hasRealPhoto: !(r['고객사 명'] || '').includes('JARIR'),
              photoFile: '',
              notes: r['특이사항'] || ''
            }));
            populateBuyerDropdown();
            document.getElementById('guideCount').innerText = guideRules.length;
            alert('엑셀 가이드가 갱신되었습니다.');
          }
        } catch (err) { alert('엑셀 읽기 오류'); }
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
